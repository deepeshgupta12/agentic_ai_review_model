# Continuous integration (Step 03.8). Checks only; no deployment jobs (D05).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts and inputs (Steps 01-02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/validate_inputs.py
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/check_contracts.py

  backend:
    name: Backend (lint, types, tests on a MongoDB replica set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB as a single-node replica set
        run: docker compose up -d --wait mongodb mongo-init
      - uses: astral-sh/setup-uv@v6
      - name: Install
        working-directory: backend
        run: uv sync --frozen
      - name: Lint and format
        working-directory: backend
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        working-directory: backend
        run: uv run mypy
      - name: Tests
        working-directory: backend
        run: uv run pytest -q

  web:
    name: Web (lint, types, API types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:api
      - run: pnpm test
      - run: pnpm build

  compose:
    name: Docker Compose stack starts and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start every service
        run: docker compose up -d --build --wait
      - name: API is ready on the replica set
        run: curl -fsS http://localhost:8000/readyz
      - name: Console login page is served
        run: curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:3000/console/login
      - name: Signed-out console redirects to login
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/console)" = "307"
      - name: Identity path in the containers (fictional catalogue, scratch database)
        run: docker compose exec -T api python -m app.cli fixture-smoke-identity
      - name: Identity evaluation (synthetic labelled set)
        run: docker compose exec -T api python -m app.cli eval-identity
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
