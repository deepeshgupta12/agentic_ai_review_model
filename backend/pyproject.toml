[project]
name = "sy-poc-backend"
version = "0.1.0"
description = "Agentic Project Intelligence POC: API, worker and scheduler"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pymongo>=4.10",
    "argon2-cffi>=23.1",
    "python-ulid>=3.0",
    "anthropic>=1,<2",
    "jsonschema>=4.23",
    "rfc8785>=0.1.4",
    "langgraph>=0.2",
    "langgraph-checkpoint-mongodb>=0.1",
    "httpx>=0.28,<0.29",
    "trafilatura>=2.2,<3",
    "tzdata>=2025.1",
    "numpy>=2.5,<3",  # Step 07: cosine similarity over a project's evidence embeddings (D50)
    "pypdf>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Step 06 (D47): installed only in the media worker image. Captions, public audio and local speech-to-text.
media = [
    "youtube-transcript-api>=1.2.4,<1.3",
    "yt-dlp>=2026.8.19",
    "faster-whisper>=1.2.1,<1.3",
]
# Step 07 (D50): installed only in the embedder image. bge-m3 (int8 ONNX) on onnxruntime, no torch.
embed = [
    "onnxruntime>=1.30,<1.31",
    "tokenizers>=0.23,<0.24",
    "huggingface-hub>=1.33,<2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header", "app.api.deps.require"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
packages = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
