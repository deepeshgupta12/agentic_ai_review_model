[project]
name = "sy-poc-backend"
version = "0.1.0"
description = "Agentic Project Intelligence POC: API, worker and scheduler"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pymongo>=4.10",
    "argon2-cffi>=23.1",
    "python-ulid>=3.0",
    "anthropic>=1,<2",
    "jsonschema>=4.23",
    "rfc8785>=0.1.4",
    "langgraph>=0.2",
    "langgraph-checkpoint-mongodb>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "app.api.deps.require"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
packages = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
