# Agentic Project Intelligence POC (Step 03, D05, D08).
# MongoDB runs as a single-node replica set so transactions and change streams work.
#   make up      build and start everything
#   make seed    create collections, then seed projects and users
services:
  mongodb:
    image: mongo:8.0
    # The cache is capped: by default it takes about half of the 4 GB Docker VM (2.1 GB seen during tests), leaving
    # too little for the media worker; the data is about 6 MB plus 3 MB of indexes. 0.25 GB was tried on 5 Oct 2026:
    # tests ran three times slower and MongoDB's memory did not fall, so 0.75 GB stays (Step 06, D48).
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.75"]
    oom_score_adj: -500  # under memory pressure the kernel kills other services before the database (Step 06)
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      # mongosh starts a new process for every probe; on a busy 4 GB VM (image builds, tests) it took longer than 5 s
      # for minutes and MongoDB was marked unhealthy while it was serving normally (6 Oct 2026)
      timeout: 20s
      retries: 30
      start_period: 10s

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongodb:
        condition: service_started
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        for i in $$(seq 1 60); do
          mongosh --quiet --host mongodb --eval '
            try { rs.status(); print("replica set already initialised") }
            catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] }); print("replica set initialised") }
          ' && exit 0
          sleep 1
        done
        exit 1

  db-setup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    # Collections, validators and indexes; then the repository's source policies and, for every project, any source
    # registered since it was added (D67: Reddit). A repeat changes nothing.
    command: ["sh", "-c", "python -m app.cli setup-db && python -m app.cli sync-catalogue"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0
    depends_on:
      db-setup:
        condition: service_completed_successfully
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0
      WORKER_ROLE: general  # every job except process_media (Step 06)
      # Delivery verification (docs/05): the worker refreshes and reads the public page on the web service.
      WEB_INTERNAL_URL: http://web:3000
    depends_on:
      db-setup:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.worker"]
    stop_grace_period: 30s

  media-worker:  # Step 06 (D47): captions, audio and local transcription, isolated and capped
    build:
      context: .
      dockerfile: backend/Dockerfile.media
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0
      WORKER_ROLE: media
    depends_on:
      db-setup:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.worker"]
    volumes:
      - whisper_models:/srv/models
    tmpfs:
      - /tmp/media:size=1g,uid=10001,mode=0700
    # The Docker VM on the demo machine has 4 GB shared with MongoDB and other stacks. Cap this worker well below
    # it, and if memory still runs out, let the kernel kill this worker first (its job is retried) and never the
    # database. Found on 1 Oct 2026, when a 3 GB model test got MongoDB killed for lack of memory.
    mem_limit: 2g
    oom_score_adj: 1000
    restart: on-failure  # back after the kernel kills it; its leased job then expires and is retried
    cpus: ${MEDIA_WORKER_CPUS:-2}  # CI runners have 2 CPUs; raise it in .env on a machine with more cores
    stop_grace_period: 60s

  embedder:  # Step 07 (D51): bge-m3 int8 embeddings for evidence search; Compose network only, no published port
    build:
      context: .
      dockerfile: backend/Dockerfile.embed
    env_file:
      - path: .env
        required: false
    volumes:
      - embedding_models:/srv/embeddings
    healthcheck:  # ready once the pinned model is downloaded (568 MB, first start only), checked and loaded
      test: ["CMD", "python", "-c", "import json, sys, urllib.request; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3))['ready'] else 1)"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    # About 0.8 GB in use with the model loaded and one text at a time (measured 7 Oct 2026). Under memory pressure the kernel kills the
    # media worker first, then this service, never the database; it restarts and search meanwhile uses keywords.
    mem_limit: 1536m
    memswap_limit: 1536m  # no swap: batches of 8 long texts swapped and ran 13 times slower (7 Oct 2026)
    oom_score_adj: 900
    restart: on-failure
    cpus: ${EMBEDDER_CPUS:-2}
    stop_grace_period: 20s

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0
    depends_on:
      db-setup:
        condition: service_completed_successfully
    command: ["python", "-m", "app.scheduler.main"]

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      # Only the shared secret of the signed revalidation route; provider keys stay with the API and the workers,
      # which run every console action with the real .env (D64: the console drives the real system).
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mongo_data:
  whisper_models:
  embedding_models:
